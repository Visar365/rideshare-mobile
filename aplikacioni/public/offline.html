<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#be3455">
  <title>RideShare · Lista e ruajtur</title>
  <style>
    :root{color-scheme:dark;--bg:#0b101b;--panel:#151f31;--border:#35435c;--text:#edf2ff;--muted:#aebbd0;--pink:#ffa4b3}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,sans-serif}
    main{max-width:720px;margin:auto;padding:28px 20px 48px}h1{font-size:clamp(1.8rem,7vw,2.5rem);line-height:1.15;margin:.4rem 0 1rem}
    .eyebrow{color:var(--pink);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem}
    .muted{color:var(--muted)}.trip-card,.notice{border:1px solid var(--border);background:var(--panel);border-radius:14px;padding:18px;margin:12px 0}
    .trip-card h2{font-size:1.15rem;margin:0 0 4px}.trip-card p{margin:0;color:var(--muted)}button,.back{display:inline-block;border:1px solid var(--pink);border-radius:10px;padding:11px 15px;background:transparent;color:var(--text);font:inherit;font-weight:700;text-decoration:none}
    button:disabled{opacity:.55}a{color:var(--pink)}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}
  </style>
</head>
<body><main>
  <p class="eyebrow">RideShare AAB · Lexim publik</p>
  <h1>Udhëtimet, edhe pa internet</h1>
  <p id="source" class="notice" role="status" aria-live="polite">Po lexojmë listën…</p>
  <p class="muted">Ruajtur për herë të fundit: <time id="saved">Ende pa kopje</time></p>
  <div class="actions"><button id="refresh" type="button">Rifresko listën</button><a class="back" href="/">Kthehu te aplikacioni</a></div>
  <div id="trips" aria-live="polite"></div>
  <p class="notice">Kjo faqe shërben vetëm për lexim. Vendet dhe orari mund të kenë ndryshuar; asnjë rezervim nuk konfirmohet.</p>
  <p><button id="book" type="button" disabled>Kërko vend · kërkon lidhje dhe server</button></p>
</main>
<script>
  const source = document.querySelector("#source");
  const list = document.querySelector("#trips");
  const refresh = document.querySelector("#refresh");
  async function load() {
    refresh.disabled = true;
    source.textContent = "Po kërkojmë listën…";
    try {
      const response = await fetch("/api/udhetimet", { cache: "no-store" });
      const data = await response.json();
      if (!response.ok || !Array.isArray(data.trips)) throw new Error("no_snapshot");
      list.replaceChildren();
      for (const trip of data.trips) {
        const card = document.createElement("article"); card.className = "trip-card";
        const title = document.createElement("h2"); title.textContent = trip.nisja + " → " + trip.destinacioni;
        const details = document.createElement("p");
        details.textContent = "Ora: " + trip.ora + " · Vendtakimi: " + trip.vendtakimi + " · Vende: " + trip.vende;
        card.append(title, details); list.append(card);
      }
      const saved = response.headers.get("x-rideshare-saved-at");
      document.querySelector("#saved").textContent = saved ? new Date(saved).toLocaleString("sq-AL") : "Lexuar drejtpërdrejt; kopja ende nuk u ruajt.";
      source.textContent = response.headers.get("x-rideshare-source") === "cache"
        ? "Lista e fundit e ruajtur · Mund të jetë vjetruar. Serveri nuk u arrit."
        : "Lista erdhi nga serveri. Lexo sërish para çdo veprimi.";
    } catch {
      source.textContent = list.children.length
        ? "Lidhja dështoi. Lista në ekran është e mëparshme; nuk ka konfirmim të ri."
        : "Ende nuk ka listë të ruajtur. Hape aplikacionin me internet dhe provo përsëri.";
    } finally { refresh.disabled = false; }
  }
  refresh.addEventListener("click", load);
  window.addEventListener("offline", () => { source.textContent = "Lidhja duket e ndërprerë. Lista e shfaqur mund të jetë e vjetër."; });
  window.addEventListener("online", () => { source.textContent = "Rrjeti duket i lidhur. Shtyp Rifresko listën për ta pyetur serverin."; });
  load();
</script></body></html>
